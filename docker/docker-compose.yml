services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: acrocuit-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "P@ssw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: acrocuit-app
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Default: "Server=mssql;Database=Acrocuit;User Id=sa;Password=P@ssw0rd;TrustServerCertificate=True"
      JwtSettings__Issuer: "Acrocuit"
      JwtSettings__Audience: "AcrocuitClient"
      JwtSettings__SecretKey: "local-dev-only-secret-00000000000000000000"
      JwtSettings__AccessTokenExpiryMinutes: "60"
      JwtSettings__RefreshTokenExpiryDays: "7"
    ports:
      - "5153:8080"

volumes:
  mssql-data:
